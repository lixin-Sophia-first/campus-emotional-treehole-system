spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/treehole}
    username: ${SPRING_DATASOURCE_USERNAME:treehole}
    password: ${SPRING_DATASOURCE_PASSWORD:treehole_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  error:
    include-message: always
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-me-now}
  admin-email: ${ADMIN_EMAIL:admin@treehole.local}
  admin-password: ${ADMIN_PASSWORD:ChangeMe123!}
  ai:
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}

